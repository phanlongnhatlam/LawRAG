version: '3.8'

services:
  backend:
    container_name: lawrag_backend
    image: phanlongnhatlam/lawrag-app:latest
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      QDRANT_URL: http://lawrag_db:6333
    env_file:
      - .env
    depends_on:
      - lawrag_db

  frontend:
    container_name: lawrag_frontend
    image: phanlongnhatlam/lawrag-app:latest
    ports:
      - "8501:8501"
    command: streamlit run frontend/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend

  lawrag_db:
    image: qdrant/qdrant:latest
    container_name: lawrag_db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:

